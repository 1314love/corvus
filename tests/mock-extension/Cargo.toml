[package]
name = "corvus-mock-extension"
version = "0.1.0"
edition = "2021"
publish = false
description = "Mock browser extension for the Corvus daemon: hello handshake, canned command answers, JSONL recording"

[[bin]]
name = "mock-extension"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
tokio-tungstenite = "0.29"

# Standalone test utility: keep it out of the repository workspace on purpose.
[workspace]
