<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Corvus</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-width: 248px;
      font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { padding: 12px 14px; display: grid; gap: 10px; }
    .row { display: flex; align-items: center; gap: 8px; }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex: none;
      background: #8a8f98;
      box-shadow: 0 0 0 2px rgba(127, 127, 127, 0.18);
    }
    .dot-on { background: #1a9f52; box-shadow: 0 0 0 2px rgba(26, 159, 82, 0.2); }
    .dot-off { background: #8a8f98; box-shadow: 0 0 0 2px rgba(127, 127, 127, 0.18); }
    #status-text { font-weight: 600; }
    dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; }
    dt { color: #6b7280; }
    dd { margin: 0; overflow-wrap: anywhere; }
    .mono { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    a { color: #2563eb; }
    .note {
      margin: 0;
      padding-top: 8px;
      color: #6b7280;
      border-top: 1px solid rgba(127, 127, 127, 0.25);
    }
  </style>
</head>
<body>
  <main>
    <div class="row">
      <span id="status-dot" class="dot dot-off" role="img" aria-label="Connection status"></span>
      <span id="status-text">Disconnected</span>
    </div>
    <dl>
      <dt>Browser ID</dt>
      <dd id="browser-id" class="mono">not assigned</dd>
      <dt>Version</dt>
      <dd id="extension-version">unknown</dd>
      <dt>Capabilities</dt>
      <dd id="capabilities">dom, scripting, debugger</dd>
      <dt>Daemon</dt>
      <dd><span id="daemon-url" class="mono">ws://127.0.0.1:7330</span> <a id="change-daemon" href="#">Change</a></dd>
    </dl>
    <p id="debugger-note" class="note">The debugger channel is managed automatically by the service worker.</p>
  </main>
  <script src="daemon_url.js"></script>
  <script src="popup.js"></script>
</body>
</html>
