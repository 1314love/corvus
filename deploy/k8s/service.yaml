apiVersion: v1
kind: Service
metadata:
  name: corvus
  namespace: corvus
  labels:
    app.kubernetes.io/name: corvus
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: corvus
  ports:
    - name: ws
      port: 7330
      targetPort: ws
      protocol: TCP
    - name: http
      port: 7331
      targetPort: http
      protocol: TCP
