apiVersion: apps/v1
kind: Deployment
metadata:
  name: corvus
  namespace: corvus
  labels:
    app.kubernetes.io/name: corvus
    app.kubernetes.io/component: daemon
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: corvus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: corvus
        app.kubernetes.io/component: daemon
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: seed-extension
          image: corvus:1.3.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - rm -rf /seed/extension && mkdir -p /seed/extension && cp -a /opt/corvus/extension/. /seed/extension/
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /seed
      containers:
        - name: corvus
          image: corvus:1.3.0
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/corvusd
          args:
            - serve
            - --bind
            - 0.0.0.0
            - --home
            - /data
          envFrom:
            - configMapRef:
                name: corvus-config
          ports:
            - name: ws
              containerPort: 7330
              protocol: TCP
            - name: http
              containerPort: 7331
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: corvus-data
        - name: tmp
          emptyDir: {}
