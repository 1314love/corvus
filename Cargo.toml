[workspace]
resolver = "2"
members = [
  "crates/corvus-cdp",
  "crates/corvus-proto",
  "crates/corvus-transport",
  "crates/corvus-runtime",
  "crates/corvus-mcp",
  "crates/corvus-record",
  "crates/corvusd",
  "crates/corvus",
]

[workspace.package]
version = "1.2.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/1314love/corvus"
rust-version = "1.90"

[workspace.dependencies]
corvus-cdp = { path = "crates/corvus-cdp" }
corvus-proto = { path = "crates/corvus-proto" }
corvus-transport = { path = "crates/corvus-transport" }
corvus-runtime = { path = "crates/corvus-runtime" }
corvus-mcp = { path = "crates/corvus-mcp" }
corvus-record = { path = "crates/corvus-record" }
corvusd = { path = "crates/corvusd" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time", "io-std", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
clap = { version = "4", features = ["derive", "env"] }
axum = { version = "0.8", features = ["ws"] }
futures = "0.3"
tokio-tungstenite = "0.29"
base64 = "0.22"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
