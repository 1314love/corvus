[workspace]
resolver = "2"
members = [
  "crates/corvus-proto",
  "crates/corvusd",
  "crates/corvus",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/1314love/corvus"
rust-version = "1.82"

[workspace.dependencies]
corvus-proto = { path = "crates/corvus-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }