[workspace]
resolver = "2"
members = [
  "crates/corvus-domain",
  "crates/corvus-application",
  "crates/corvus-cdp",
  "crates/corvus-proto",
  "crates/corvus-transport",
  "crates/corvus-mcp",
  "crates/corvus-record",
  "crates/corvus-api",
  "crates/corvusd",
  "crates/corvus",
]

[workspace.package]
version = "1.4.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/1314love/corvus"
rust-version = "1.90"

[workspace.dependencies]
corvus-domain = { path = "crates/corvus-domain" }
corvus-application = { path = "crates/corvus-application" }
corvus-cdp = { path = "crates/corvus-cdp" }
corvus-proto = { path = "crates/corvus-proto" }
corvus-transport = { path = "crates/corvus-transport" }
corvus-mcp = { path = "crates/corvus-mcp" }
corvus-record = { path = "crates/corvus-record" }
corvus-api = { path = "crates/corvus-api" }
corvusd = { path = "crates/corvusd" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time", "io-std", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
clap = { version = "4", features = ["derive", "env"] }
axum = { version = "0.8", features = ["ws"] }
futures = "0.3"
tokio-tungstenite = "0.29"
base64 = "0.22"
rusqlite = { version = "0.40", features = ["bundled"] }
sea-orm = { version = "1.1.19", default-features = false, features = ["runtime-tokio-rustls", "sqlx-sqlite", "macros", "with-json"] }
sea-orm-migration = { version = "1.1.19", default-features = false, features = ["runtime-tokio-rustls", "sqlx-sqlite", "with-json"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "migrate", "json"] }
regex = "1.13.1"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
async-trait = "0.1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6.11", features = ["cors", "trace", "timeout", "compression-gzip", "request-id"] }
utoipa = { version = "5.4.0", features = ["axum_extras"] }
utoipa-axum = "0.2.0"
utoipa-swagger-ui = { version = "9.0.2", default-features = false, features = ["axum", "vendored"] }
jsonwebtoken = "9.3.1"
argon2 = "0.5.3"
secrecy = "0.10.3"
validator = { version = "0.20.0", features = ["derive"] }
config = "0.15.27"
dotenvy = "0.15.7"
rand = "0.8.5"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
